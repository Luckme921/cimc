weld_seam_node:
  ros__parameters:
    input_ply_topic: "/camera/pointcloud_file"
    # 空字符串 => $SCUT_WELD_DATA_ROOT/weld_results；未设环境变量时
    # => ~/scut_weld_data/weld_results。运行数据不写入 ROS install/share。
    output_directory: ""
    output_prefix: "weld_seam"
    config_file: ""
    frame_id: "camera_link"
    # 算法 CSV 是 mm，ROS2 PoseArray 按 REP-103 发布为 m。
    position_scale_to_ros: 0.001
    auto_process: true
    algorithm_overrides:
      - "roi.enable=false"
      - "normal.mode=auto"
      - "orientation.tool_positive_z_points_from_tcp_to_body=false"
      # Tool +X 参考固定工件焊接前进轴，减少不同角点间绕焊枪轴滚转。
      # 若现场 TCP +X 与焊接前进方向相反，只把下一项 true 改为 false。
      - "orientation.tool_x_reference=workpiece_x"
      - "orientation.tool_x_points_along_positive_workpiece_x=true"
