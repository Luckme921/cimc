weld_seam_node:
  ros__parameters:
    input_ply_topic: "/camera/pointcloud_file"
    # 空字符串 => $SCUT_WELD_DATA_ROOT/weld_results；未设环境变量时
    # => ~/scut_weld_data/weld_results。运行数据不写入 ROS install/share。
    output_directory: ""
    output_prefix: "weld_seam"
    config_file: ""
    frame_id: "camera_link"
    # 算法 CSV 是 mm，ROS2 PoseArray 按 REP-103 发布为 m。
    position_scale_to_ros: 0.001
    auto_process: true
    algorithm_overrides:
      - "roi.enable=false"
      - "normal.mode=auto"
      - "orientation.tool_positive_z_points_from_tcp_to_body=true"
