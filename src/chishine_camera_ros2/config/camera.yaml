chishine_camera_node:
  ros__parameters:
    camera_serial: ""
    # 厂商 SDK 会自动发现网络/USB相机，然后按 camera_serial 选择。
    # 相机 IP 和 Jetson 主机 IP 不在这里传给 connect()；它们由相机和 Linux 网卡配置。
    enable_network_discovery: true
    enable_usb_discovery: true
    discovery_timeout_ms: 3000
    # 相机/网卡上电可能晚于 ROS2 节点；重复枚举与厂商示例的处理一致。
    discovery_attempts: 10
    discovery_retry_interval_ms: 1000
    # 空字符串 => $SCUT_WELD_DATA_ROOT/pointclouds；未设环境变量时
    # => ~/scut_weld_data/pointclouds。
    output_directory: ""
    file_prefix: "capture"
    capture_timeout_ms: 5000
    depth_width: 0
    depth_height: 0
    depth_fps: 0.0
    rgb_width: 0
    rgb_height: 0
    rgb_fps: 0.0
    # 焊缝提取只需 XYZ；false 更快且不会因 RGB 视场映射裁掉深度点。
    enable_rgb: false
    binary_ply: true
    depth_min_mm: 460
    depth_max_mm: 520
    depth_gain: 1.0
    depth_exposure: 8000.0
    depth_frame_time: 10000.0
