handeye_abb_bridge_node:
  ros__parameters:
    # 标定矩阵本体与方向都在本配置中统一指定。
    matrix_file: "/home/mini/x86_ros2_ws/src/cimc/config/handeye_result20260723.yaml"
    matrix_key: "handEyeMatrix"
    matrix_direction: "tcp_from_camera"
    matrix_translation_unit: "mm"
    output_frame_id: "robot_base"
    require_capture_pose: true
    require_task_armed: true
    # ABB联调launch要求true；原安全测试launch仍会拒绝true。
    # ABB端当前只允许存储/打印轨迹，禁止执行运动。
    send_to_abb: true
    protocol_precision: 6
