weld_remote_interface_node:
  ros__parameters:
    # false: 只验证模拟指令并发布 /weld/remote/status，不转发到焊机/电机。
    # 确认气路、焊机、旋转电机、硬件急停和指令顺序后才能改为 true。
    output_enabled: false
    require_gas_before_weld: true

    # 一元模式只由外部调节电流；电压占位值仅用于兼容底层两元数组接口。
    # 底层 use_builtin_curve 生效时，该电压值不参与 CAN 压强计算。
    unary_voltage_placeholder_v: 20.0

    min_current_a: 1.0
    max_current_a: 350.0
    min_rotation_speed_rps: 0.0
    # 现有历史工艺使用 6 r/s；未核对电机上限前先用 10 r/s 软限制。
    max_rotation_speed_rps: 10.0

    # 192.168.3.5 正式报文协议确定后，网络解析层只需向这两个输入话题发布。
    command_topic: "/weld/remote/command"
    setpoints_topic: "/weld/remote/setpoints"
    status_topic: "/weld/remote/status"

    # 现有稳定的底层接口，不修改话题语义。
    weld_control_topic: "/weld/control"
    weld_parameter_topic: "/weld/set_param_real"
    motor_speed_topic: "/cimc/motor_speed"
